<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h4 class="fw-bold mb-4">비밀번호 변경</h4>

    <form th:action="@{/user/password}" th:object="${passwordChangeDto}" method="post">
        <div class="mb-3">
            <label class="form-label">현재 비밀번호</label>
            <input type="password" th:field="*{currentPassword}" class="form-control">
            <div class="text-danger small" th:errors="*{currentPassword}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">새 비밀번호</label>
            <input type="password" th:field="*{newPassword}" class="form-control">
            <div class="text-danger small" th:errors="*{newPassword}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">새 비밀번호 확인</label>
            <input type="password" th:field="*{confirmPassword}" class="form-control">
            <div class="text-danger small" th:errors="*{confirmPassword}"></div>
        </div>
        <button type="submit" class="btn btn-primary">변경</button>
        <a th:href="@{/home}" class="btn btn-secondary">취소</a>
    </form>
</div>
<footer class="text-center text-muted small mt-4 pt-3 border-top">
    <p>실습 수행: <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></span> | 학번: 2171398 | 성명: 오승준</p>
</footer>
</body>
</html>
